name: MEXC Momentum Analysis

on:
  schedule:
    - cron: '0 */12 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mexc-momentum-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      TARGET_BRANCH: analysis-results

    steps:
      - name: Checkout scanner data branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}
          path: scanner
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scanner/requirements.txt

      - name: Install dependencies
        working-directory: scanner
        run: pip install -r requirements.txt

      - name: Prepare analysis results branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --no-checkout "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" analysis-output
          cd analysis-output
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

          if git ls-remote --exit-code --heads origin "${TARGET_BRANCH}" >/dev/null 2>&1; then
            git fetch --depth 1 origin "${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
            git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          else
            git checkout --orphan "${TARGET_BRANCH}"
            git read-tree --empty
          fi

          mkdir -p reports

      - name: Generate analysis reports
        working-directory: scanner
        run: |
          python tools/analyze_experiments.py --in data/experiments.json --out ../analysis-output/reports/experiment_report.md
          python tools/decision_report.py --in data/experiments.json --out ../analysis-output/reports/decision_report.md

      - name: Save reports to analysis branch
        shell: bash
        working-directory: analysis-output
        run: |
          set -euo pipefail
          git add reports/
          if git diff --staged --quiet; then
            echo "No analysis report changes to commit."
            exit 0
          fi

          git commit -m "chore: update analysis reports [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            git fetch origin "${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" || true
            if git rev-parse --verify "origin/${TARGET_BRANCH}" >/dev/null 2>&1; then
              git rebase "origin/${TARGET_BRANCH}" || git rebase --abort || true
            fi
            echo "Analysis report push failed (attempt ${attempt}/3). Retrying..."
            sleep 5
          done

          echo "Failed to save analysis reports after retries."
          exit 1
