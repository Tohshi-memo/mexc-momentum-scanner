name: MEXC Momentum Scanner

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY RUN mode (true=ログのみ / false=実注文)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# tracking.json をコミットするため write 権限が必要
permissions:
  contents: write

concurrency:
  group: mexc-momentum-scanner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

      # --- API 認証情報 ---
      MEXC_API_KEY:           ${{ secrets.MEXC_API_KEY }}
      MEXC_SECRET_KEY:        ${{ secrets.MEXC_SECRET_KEY }}

      # --- 通知 ---
      DISCORD_WEBHOOK_URL:    ${{ secrets.DISCORD_WEBHOOK_URL }}

      # --- ファンダ設定 (RSS + Reddit, APIキー不要) ---
      FUNDAMENTAL_LOOKBACK_HOURS: '48'
      USE_REDDIT_NEWS:            'true'

      # --- 実行モード ---
      RUN_ONCE: 'true'
      DRY_RUN:  ${{ github.event.inputs.dry_run || 'true' }}

      # --- スキャン設定 ---
      BTC_BEARISH_THRESHOLD:       '-0.5'
      BTC_STAGNANT_THRESHOLD:      '0.2'
      ALT_SURGE_THRESHOLD:         '5.0'
      # BTC 上昇時でも「乖離した独歩高」を検出するための相対強度閾値
      RELATIVE_STRENGTH_THRESHOLD: '5.0'
      MIN_24H_VOLUME_USDT:         '1000000'
      MAX_OHLCV_CHECKS:            '50'

      # --- テクニカル設定 ---
      RSI_PERIOD:        '14'
      RSI_OVERBOUGHT:    '70'
      BB_PERIOD:         '20'
      BB_STD:            '2.0'
      ANALYSIS_TIMEFRAME: '1h'
      OHLCV_LIMIT:       '100'

      # --- STRICT v2 フィルター (2026-04 データ駆動見直し) ---
      RSI_4H_MAX:              '65'   # 4h RSI < 65 が唯一のゲート条件
      USE_4H_FILTER:           'true'
      VOLUME_LOOKBACK:         '20'
      VOLUME_RISING_RATIO:     '1.8'
      VOLUME_DECLINING_RATIO:  '0.8'
      ATR_PERIOD:              '14'
      USE_ATR_SL:              'true'
      ATR_SL_MULT:             '1.5'
      ATR_SL_MIN:              '1.0'
      ATR_SL_MAX:              '4.0'
      RISK_REWARD_RATIO:       '2.0'
      COOLDOWN_HOURS:          '48'
      CIRCUIT_BREAKER_WINDOW:  '10'
      CIRCUIT_BREAKER_LOSSES:  '5'
      # 直近 N 時間内に closed した記録のみでカウント (0 で無効=全期間)
      # これを超えて古い連敗は自動で対象外になり、放置で自動解除される
      CIRCUIT_BREAKER_LOOKBACK_HOURS: '48'

      # --- リスク設定 (ATR 無効時のフォールバック) ---
      STOP_LOSS_PCT:     '2.0'
      TAKE_PROFIT_PCT:   '4.0'

      # --- 追跡設定 ---
      TRACKING_HOURS:    '24'

      # --- フィルター粒度実験 (シャドウトレード) ---
      # 全候補 (STRICT 通過/外問わず) を仮想追跡し、フィルター変更時の
      # PnL を後から再評価できるようにする。実トレードには影響しない。
      EXPERIMENT_TRACKING_HOURS: '8'
      EXPERIMENT_MAX_PER_CYCLE:  '20'
      # ホット experiments.json に保持する closed 件数の上限。
      # 超過分は古い方から data/archive/experiments_YYYY-MM.json.gz に
      # gzip アーカイブされる。analyze_experiments.py は hot + archive を
      # 結合して読むため、分析精度は落ちない。
      EXPERIMENT_HOT_MAX:        '500'

      # --- 軽量な検出前コンテキスト計測 ---
      # data/market_context.json に市場全体の集計・上位候補・near missだけをローリング保存
      MARKET_CONTEXT_ENABLED:               'true'
      MARKET_CONTEXT_MAX_RECORDS:           '288'
      MARKET_CONTEXT_TOP_SYMBOLS:           '20'
      MARKET_CONTEXT_NEAR_MISS_LIMIT:       '30'
      MARKET_CONTEXT_ANALYSIS_SYMBOL_LIMIT: '25'

      # --- ライブ戦略の安全弁 ---
      LIVE_MIN_EV_PCT:           '0.20'
      LIVE_MIN_RANKER_FILLED:    '10'
      LIVE_SHORT_ONLY:           'true'

      # --- ログ ---
      LOG_LEVEL: 'INFO'
      LOG_FILE:  'logs/scanner.log'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # tracking.json を push するためトークンを指定
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner (single cycle)
        run: python main.py

      - name: Save tracking data to repository
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data/ --force 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore: update tracking data [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Data push failed (attempt ${attempt}/3). Retrying..."
            sleep 5
          done

          echo "Failed to save tracking data after retries."
          exit 1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
